spring:
  application:
    name: anime-service
  threads:
    virtual:
      enabled: true
logging:
  level:
    academy.devdojo: debug

server:
  servlet:
    context-path: /
  error:
    include-stacktrace: on_param
    include-message: always
  tomcat:
    threads:
      max: 20

database:
  url: ${DB_URL:localhost}:${DB_PORT:3006}
  username: ${LOCAL_USERNAME:}
  password: ${LOCAL_PASSWORD:}
